<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>Profile | Geo Solution</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #faf9fa;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(15, 43, 61, 0.06);
            box-shadow: 0 2px 16px -2px rgba(15, 43, 61, 0.06);
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(0, 180, 216, 0.1);
            box-shadow: 0 4px 24px -4px rgba(15, 43, 61, 0.1);
        }
        
        .admin-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: #0f2b3d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }
        
        .admin-sidebar .brand {
            padding: 24px 24px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        
        .admin-sidebar .brand h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin: 0;
        }
        
        .admin-sidebar .brand p {
            font-size: 12px;
            color: rgba(192, 232, 255, 0.6);
            margin: 2px 0 0;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        
        .admin-sidebar .cta-btn {
            margin: 16px 24px 20px;
            padding: 12px 16px;
            background: #c0e8ff;
            color: #001e2b;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .admin-sidebar .cta-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(192, 232, 255, 0.3);
        }
        
        .admin-sidebar .cta-btn .material-symbols-outlined {
            font-size: 20px;
        }
        
        .sidebar-nav {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
        }
        
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 10px;
            color: rgba(192, 232, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
            margin-bottom: 2px;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.06);
            color: #ffffff;
        }
        
        .sidebar-nav a.active {
            background: #001624;
            color: #c0e8ff;
            font-weight: 700;
            border-right: 4px solid #00b4d8;
        }
        
        .sidebar-nav a .material-symbols-outlined {
            font-size: 22px;
        }
        
        .sidebar-profile {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: auto;
        }
        
        .sidebar-profile .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(192, 232, 255, 0.3);
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .sidebar-profile .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .sidebar-profile .info {
            flex: 1;
            min-width: 0;
        }
        
        .sidebar-profile .info .name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            display: block;
            line-height: 1.2;
        }
        
        .sidebar-profile .info .email {
            font-size: 11px;
            color: rgba(192, 232, 255, 0.5);
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .sidebar-profile .logout-btn {
            background: none;
            border: none;
            color: rgba(192, 232, 255, 0.5);
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s;
            font-size: 20px;
        }
        
        .sidebar-profile .logout-btn:hover {
            color: #ffffff;
        }
        
        .admin-main {
            flex: 1;
            margin-left: 260px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .top-nav {
            position: fixed;
            top: 0;
            left: 260px;
            right: 0;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(195, 199, 204, 0.15);
            z-index: 99;
        }
        
        .top-nav .search-wrap {
            flex: 1;
            max-width: 400px;
            position: relative;
        }
        
        .top-nav .search-wrap .material-symbols-outlined {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #73777d;
            font-size: 20px;
        }
        
        .top-nav .search-wrap input {
            width: 100%;
            padding: 9px 16px 9px 44px;
            border: none;
            border-radius: 50px;
            background: #f4f3f5;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            outline: none;
        }
        
        .top-nav .search-wrap input:focus {
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.15);
        }
        
        .top-nav .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .top-nav .nav-actions .icon-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            color: #73777d;
            transition: color 0.3s;
            padding: 4px;
        }
        
        .top-nav .nav-actions .icon-btn:hover {
            color: #0f2b3d;
        }
        
        .top-nav .nav-actions .icon-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: #e63946;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .top-nav .nav-actions .material-symbols-outlined {
            font-size: 24px;
        }
        
        .dashboard-content {
            padding: 80px 32px 48px;
            flex: 1;
            max-width: 1440px;
            width: 100%;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0f2b3d;
            box-shadow: 0 4px 20px rgba(15, 43, 61, 0.15);
        }
        
        .profile-avatar-lg {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0f2b3d;
            box-shadow: 0 4px 20px rgba(15, 43, 61, 0.15);
        }
        
        .badge-exam {
            background: #0f2b3d;
            color: #ffffff;
        }
        
        .badge-training {
            background: #a3dfff;
            color: #004d66;
        }
        
        .badge-present {
            background: rgba(45, 155, 78, 0.12);
            color: #2d9b4e;
        }
        
        .badge-late {
            background: rgba(244, 162, 97, 0.12);
            color: #f4a261;
        }
        
        .badge-absent {
            background: rgba(230, 57, 70, 0.12);
            color: #e63946;
        }
        
        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        .status-dot.present { background: #2d9b4e; }
        .status-dot.late { background: #f4a261; }
        .status-dot.absent { background: #e63946; }
        
        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: #ffffff;
            padding: 4px;
        }
        
        .hamburger-btn .material-symbols-outlined {
            font-size: 28px;
        }
        
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(195,199,204,0.15);
            padding: 6px 8px;
            justify-content: space-around;
        }
        
        .mobile-bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #94a3b8;
            font-size: 9px;
            font-weight: 600;
            padding: 4px 12px;
            transition: color 0.2s;
        }
        
        .mobile-bottom-nav a.active {
            color: #0f2b3d;
        }
        
        .mobile-bottom-nav a .material-symbols-outlined {
            font-size: 24px;
        }
        
        .mobile-bottom-nav a span:last-child {
            margin-top: 2px;
        }
        
        /* ============================================ */
        /* ✅ RESPONSIVE BREAKPOINTS */
        /* ============================================ */
        @media (max-width: 1024px) {
            .top-nav {
                padding: 0 20px;
            }
            .dashboard-content {
                padding: 80px 20px 48px;
            }
        }
        
        @media (max-width: 992px) {
            /* ✅ Profile layout stacks on tablet */
            .profile-grid {
                grid-template-columns: 1fr !important;
            }
            
            .profile-sidebar {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                gap: 16px !important;
                padding: 16px !important;
            }
            
            .profile-sidebar .avatar-container {
                flex-shrink: 0;
            }
            
            .profile-sidebar .info-container {
                flex: 1;
                min-width: 200px;
                text-align: left !important;
            }
            
            .profile-avatar-lg {
                width: 120px !important;
                height: 120px !important;
            }
        }
        
        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            
            .admin-sidebar.open {
                transform: translateX(0);
            }
            
            .admin-main {
                margin-left: 0;
            }
            
            .top-nav {
                left: 0;
                width: 100%;
                padding: 0 16px;
                background: #0f2b3d;
                border-bottom: none;
            }
            
            .top-nav .search-wrap input {
                background: rgba(255, 255, 255, 0.12);
                color: #ffffff;
            }
            
            .top-nav .search-wrap input::placeholder {
                color: rgba(255, 255, 255, 0.5);
            }
            
            .top-nav .search-wrap .material-symbols-outlined {
                color: rgba(255, 255, 255, 0.5);
            }
            
            .top-nav .nav-actions .icon-btn {
                color: rgba(255, 255, 255, 0.7);
            }
            
            .top-nav .nav-actions .icon-btn:hover {
                color: #ffffff;
            }
            
            .hamburger-btn {
                display: block;
            }
            
            .dashboard-content {
                padding: 80px 16px 80px;
            }
            
            .page-header h2 {
                font-size: 22px !important;
            }
            
            .page-header {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 8px !important;
            }
            
            .page-header .header-actions {
                width: 100% !important;
                justify-content: flex-start !important;
            }
            
            /* ✅ Profile layout stacks on mobile */
            .profile-grid {
                grid-template-columns: 1fr !important;
                gap: 16px !important;
            }
            
            .profile-sidebar {
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
                padding: 16px !important;
            }
            
            .profile-sidebar .info-container {
                text-align: center !important;
            }
            
            .profile-avatar-lg {
                width: 100px !important;
                height: 100px !important;
            }
            
            .profile-info-grid {
                grid-template-columns: 1fr !important;
                gap: 4px 0 !important;
            }
            
            .profile-info-grid .full-width {
                grid-column: 1 !important;
            }
            
            .profile-actions {
                flex-wrap: wrap !important;
                justify-content: center !important;
            }
            
            .profile-actions button,
            .profile-actions a {
                flex: 1 !important;
                min-width: 100px !important;
                justify-content: center !important;
            }
            
            .mobile-bottom-nav {
                display: flex !important;
            }
            
            .table-wrap table {
                font-size: 12px !important;
                min-width: 500px !important;
            }
            
            .table-wrap table th,
            .table-wrap table td {
                padding: 6px 8px !important;
            }
            
            .attendance-stats {
                gap: 8px !important;
                flex-wrap: wrap !important;
            }
            
            .attendance-stats span {
                font-size: 12px !important;
            }
        }
        
        @media (max-width: 480px) {
            .profile-avatar-lg {
                width: 80px !important;
                height: 80px !important;
            }
            
            .profile-sidebar h3 {
                font-size: 18px !important;
            }
            
            .profile-sidebar .badge {
                font-size: 10px !important;
                padding: 2px 12px !important;
            }
            
            .profile-info-grid {
                font-size: 13px !important;
            }
            
            .profile-info-grid .label {
                font-size: 12px !important;
            }
            
            .profile-info-grid .value {
                font-size: 13px !important;
            }
            
            .page-header h2 {
                font-size: 20px !important;
            }
            
            .page-header p {
                font-size: 13px !important;
            }
            
            .page-header .header-actions button {
                font-size: 11px !important;
                padding: 6px 12px !important;
            }
            
            .page-header .header-actions button .material-symbols-outlined {
                font-size: 16px !important;
            }
        }
        
        .admin-sidebar::-webkit-scrollbar {
            width: 4px;
        }
        
        .admin-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .admin-sidebar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }
        
        .admin-sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.25);
        }
        
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .table-wrap table {
            min-width: 600px;
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        .table-wrap table thead {
            background: #0f2b3d;
            color: #ffffff;
        }
        
        .table-wrap table thead th {
            padding: 10px 14px;
            text-align: left;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
        }
        
        .table-wrap table tbody td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(195, 199, 204, 0.08);
            color: #1a1c1d;
        }
        
        .table-wrap table tbody tr {
            transition: background 0.2s;
        }
        
        .table-wrap table tbody tr:hover {
            background: rgba(15, 43, 61, 0.02);
        }
    </style>
</head>
<body>
    <!-- ========================================== -->
    <!-- SIDEBAR -->
    <!-- ========================================== -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="brand">
            <h1>Geo Solution</h1>
            <p>Management Portal</p>
        </div>
        
        <button class="cta-btn" id="registerStudentBtn">
            <span class="material-symbols-outlined">person_add</span>
            Register Student
        </button>
        
        <nav class="sidebar-nav">
            <a href="/admin_dashboard.html" id="navDashboard">
                <span class="material-symbols-outlined">dashboard</span>
                Dashboard
            </a>
            <a href="/admin_students.html" id="navStudents">
                <span class="material-symbols-outlined">school</span>
                Students
            </a>
            <a href="/admin_finance.html" id="navFinance">
                <span class="material-symbols-outlined">payments</span>
                Finance
            </a>
            <a href="/admin_staff.html" id="navStaff">
                <span class="material-symbols-outlined">group</span>
                Staff
            </a>
            <a href="/admin_attendance.html" id="navAttendance">
                <span class="material-symbols-outlined">event_available</span>
                Attendance
            </a>
            <a href="/admin_notes.html" id="navNotes">
                <span class="material-symbols-outlined">sticky_note_2</span>
                Notes
            </a>
            <a href="/settings.html" id="navSettings">
                <span class="material-symbols-outlined">settings</span>
                Settings
            </a>
        </nav>
        
        <div class="sidebar-profile">
            <div class="avatar">
                <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDT2_hO-XrJ4mCZoTCMpOHrVmFQY3hOKslq0mJ_RrNnx3imKF7GK18iCpfUzr6p7L_oLqb-BjEU4IVOJqkGa3kzOA2rDFs1uMBu32rEtPA8672O7qkhFsApz8I0V_6Ur7qAs8DH0OxZ2dQlnTw4kRW7kYLv0Swj9tM9lttZ-mwnbC_gQT_zbOwsLBzhyPLKdBunltvxlizmk_SV9I53NdP8yQfbmYSRBRG67KOBlp40XoWX6ukR49jHlA4Ey99PfmoHBCHIaBJyHCOW" alt="Admin">
            </div>
            <div class="info">
                <span class="name" id="adminName">Administrator</span>
                <span class="email" id="adminEmail">admin@email.com</span>

            <button class="logout-btn" id="logoutBtn" title="Logout">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </aside>

    <!-- ========================================== -->
    <!-- MAIN CONTENT -->
    <!-- ========================================== -->
    <main class="admin-main">
        <header class="top-nav">
            <button class="hamburger-btn" id="sidebarToggle">
                <span class="material-symbols-outlined">menu</span>
            </button>
            
            <div class="search-wrap">
                <span class="material-symbols-outlined">search</span>
                <input type="text" placeholder="Search..." id="searchInput">
            </div>
            
            <div class="nav-actions">

                    <span class="material-symbols-outlined">notifications</span>

                    <span class="material-symbols-outlined">help</span>

        </header>

        <div class="dashboard-content">
            <!-- ========================================== -->
            <!-- PAGE HEADER - Responsive -->
            <!-- ========================================== -->
            <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:24px;">

                        <span class="material-symbols-outlined" style="font-size:18px;">arrow_back</span>

                    </button>

            <!-- ========================================== -->
            <!-- PROFILE CONTENT -->
            <!-- ========================================== -->
            <div id="profileContent">
                <div style="text-align:center; padding:60px; color:#94a3b8;">

    <!-- ========================================== -->
    <!-- SCRIPTS -->
    <!-- ========================================== -->
    <script src="js/config.js"></script>
    <script>
        const BASE_API = window.BASE_API || 'https://geosolutionv2.onrender.com/api';

        // =============================================
        // ✅ AUTH - No inline event handlers
        // =============================================
        (async function protectPage() {
            try {
                const response = await fetch(`${window.BASE_API}/auth/check-session`, {
                    credentials: 'include'
                });
                const data = await response.json();
                if (!data.valid) {
                    window.location.href = 'access.html';
                    return;
                }
                if (data.role !== 'admin' && data.role !== 'secretary') {
                    window.location.href = 'access.html';
                    return;
                }
                document.getElementById('adminName').textContent = data.name || data.email.split('@')[0];
                document.getElementById('adminEmail').textContent = data.email;
            } catch (err) {
                window.location.href = 'access.html';
            }
        })();

        // =============================================
        // ✅ NAVIGATION HELPERS
        // =============================================
        function navigateTo(url) {
            window.location.href = url;
        }

        function goBack() {
            window.history.back();
        }

        function printPage() {
            window.print();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                fetch(`${BASE_API}/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                })
                .then(() => {
                    window.location.href = 'access.html';
                })
                .catch(() => {
                    window.location.href = 'access.html';
                });
            }
        }

        // =============================================
        // ✅ LOAD PROFILE
        // =============================================
        async function loadProfile() {
            const container = document.getElementById('profileContent');
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type') || 'student';
            const id = urlParams.get('id');

            if (!id) {
                container.innerHTML = `
                    <div style="text-align:center; padding:60px; color:#e63946;">
                        <span class="material-symbols-outlined" style="font-size:48px; display:block; margin-bottom:12px;">error</span>
                        <p>No ID provided. Please go back and select a student or staff.</p>
                    </div>
                `;
                return;
            }

            try {
                let response;
                let data;

                if (type === 'student') {
                    response = await fetch(`${BASE_API}/profile/student/${id}`);
                    if (!response.ok) throw new Error('Failed to fetch student profile');
                    data = await response.json();
                    renderStudentProfile(data);
                } else if (type === 'staff') {
                    response = await fetch(`${BASE_API}/profile/staff/${id}`);
                    if (!response.ok) throw new Error('Failed to fetch staff profile');
                    data = await response.json();
                    renderStaffProfile(data);
                } else {
                    container.innerHTML = `
                        <div style="text-align:center; padding:60px; color:#e63946;">
                            <p>Invalid profile type.</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Error loading profile:', err);
                container.innerHTML = `
                    <div style="text-align:center; padding:60px; color:#e63946;">
                        <span class="material-symbols-outlined" style="font-size:48px; display:block; margin-bottom:12px;">error</span>
                        <p>Error loading profile. Please try again.</p>
                    </div>
                `;
            }
        }

        // =============================================
        // ✅ RENDER STUDENT PROFILE - Responsive
        // =============================================
        function renderStudentProfile(data) {
            const container = document.getElementById('profileContent');
            const student = data.student;
            const parent = data.parent;
            const attendance = data.attendance || [];

            document.getElementById('profileTitle').textContent = `👤 ${student.full_name || 'Student'}`;
            document.getElementById('profileSubtitle').textContent = `Student Profile • ${student.student_type === 'exam' ? 'Exam Student' : 'Computer Training'}`;

            const isExam = student.student_type === 'exam';
            const courseDept = isExam ? student.department : student.course;
            const typeLabel = isExam ? 'EXAM' : 'TRAINING';
            const typeBadge = isExam ? 'badge-exam' : 'badge-training';

            // Attendance stats
            let present = 0, late = 0, absent = 0;
            attendance.forEach(a => {
                if (a.punctuality === 'LATE') late++;
                else if (a.punctuality === 'PRESENT' || a.punctuality === 'EARLY') present++;
                else absent++;
            });

            let attendanceHtml = '';
            if (attendance.length === 0) {
                attendanceHtml = `
                    <tr>
                        <td colspan="4" style="text-align:center; padding:20px; color:#94a3b8;">No attendance records found.</td>
                    </tr>
                `;
            } else {
                attendance.slice(0, 10).forEach(a => {
                    const statusClass = a.punctuality === 'LATE' ? 'badge-late' : 
                                       a.punctuality === 'ABSENT' ? 'badge-absent' : 'badge-present';
                    const statusDot = a.punctuality === 'LATE' ? 'late' : 
                                     a.punctuality === 'ABSENT' ? 'absent' : 'present';
                    const statusColor = a.punctuality === 'LATE' ? '#f4a261' : 
                                       a.punctuality === 'ABSENT' ? '#e63946' : '#2d9b4e';
                    const statusLabel = a.punctuality || 'PRESENT';
                    
                    attendanceHtml += `
                        <tr>
                            <td style="padding:8px 12px; color:#64748b; font-size:13px;">${a.log_date || a.date || '—'}</td>
                            <td style="padding:8px 12px; font-weight:500; font-size:13px;">${a.sign_in || '—'}</td>
                            <td style="padding:8px 12px;">
                                <span class="${statusClass}" style="padding:2px 10px; border-radius:20px; font-size:9px; font-weight:600; display:inline-flex; align-items:center; gap:4px;">
                                    <span class="status-dot ${statusDot}" style="width:5px; height:5px; border-radius:50%; display:inline-block; background:${statusColor};"></span>
                                    ${statusLabel}
                                </span>
                            </td>
                            <td style="padding:8px 12px; color:#94a3b8; font-size:13px;">${a.sign_out || '—'}</td>
                        </tr>
                    `;
                });
            }

            // ✅ PHOTO
            let photoHtml = '';
            if (student.photo_url) {
                const photoSrc = student.photo_url.startsWith('data:') || student.photo_url.startsWith('http') 
                    ? student.photo_url 
                    : `data:image/jpeg;base64,${student.photo_url}`;
                photoHtml = `<img src="${photoSrc}" alt="${student.full_name}" class="profile-avatar-lg" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`;

                    <div style="width:150px; height:150px; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center; border:4px solid #0f2b3d;">
                        <span class="material-symbols-outlined" style="font-size:64px; color:#94a3b8;">person</span>

            let formHtml = '';
            if (student.form_url) {
                const formSrc = student.form_url.startsWith('data:') || student.form_url.startsWith('http') 
                    ? student.form_url 
                    : `data:application/pdf;base64,${student.form_url}`;

                    <a href="${formSrc}" target="_blank" class="download-form-link" style="padding:8px 20px; background:#1a5f7a; color:#ffffff; border:none; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
                        <span class="material-symbols-outlined" style="font-size:18px;">download</span>
                        Download Signed Form
                    </a>
                `;
            } else {
                formHtml = `<span style="color:#94a3b8; font-size:13px;">No form uploaded</span>`;
            }

            // ✅ RESPONSIVE LAYOUT - Uses 'profile-grid' class for stacking
            container.innerHTML = `
                <div class="profile-grid" style="display:grid; grid-template-columns:1fr 2fr; gap:24px;">
                    <!-- LEFT COLUMN - Profile Sidebar -->
                    <div class="profile-sidebar" style="display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px; background:rgba(255,255,255,0.5); border-radius:14px; border:1px solid rgba(15,43,61,0.04);">
                        <div class="avatar-container">
                            ${photoHtml}
                        </div>
                        <div class="info-container" style="text-align:center;">
                            <h3 style="font-size:20px; font-weight:700; color:#0f2b3d; margin:0;">${student.full_name}</h3>
                            <span class="${typeBadge}" style="padding:4px 16px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; display:inline-block; margin-top:4px;">${typeLabel}</span>
                            <p style="font-size:13px; color:#64748b; margin:6px 0 0;">${student.matric_number || '—'}</p>
                        </div>
                        <div class="profile-actions" style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%;">
                            ${formHtml}
                        </div>
                    </div>

                    <!-- RIGHT COLUMN - Details -->
                    <div style="display:flex; flex-direction:column; gap:20px;">
                        <!-- Personal Information -->
                        <div class="glass-card" style="padding:18px 20px; border-radius:14px;">
                            <h4 style="font-size:14px; font-weight:600; color:#0f2b3d; margin:0 0 10px;">Personal Information</h4>
                            <div class="profile-info-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; font-size:14px;">
                                <div><span style="color:#64748b;">Name:</span> <span style="font-weight:500;">${student.full_name}</span></div>
                                <div><span style="color:#64748b;">Matric:</span> <span style="font-weight:500;">${student.matric_number || '—'}</span></div>
                                <div><span style="color:#64748b;">Gender:</span> <span style="font-weight:500;">${student.gender || '—'}</span></div>
                                <div><span style="color:#64748b;">DOB:</span> <span style="font-weight:500;">${student.date_of_birth || '—'}</span></div>
                                <div><span style="color:#64748b;">Phone:</span> <span style="font-weight:500;">${student.phone_number || '—'}</span></div>
                                <div><span style="color:#64748b;">Email:</span> <span style="font-weight:500;">${student.email || '—'}</span></div>
                                <div class="full-width" style="grid-column:1/-1;"><span style="color:#64748b;">Address:</span> <span style="font-weight:500;">${student.address || '—'}</span></div>
                                <div class="full-width" style="grid-column:1/-1;"><span style="color:#64748b;">${isExam ? 'Department' : 'Course'}:</span> <span style="font-weight:500;">${courseDept || '—'}</span></div>
                                ${isExam ? `<div><span style="color:#64748b;">Exam Type:</span> <span style="font-weight:500;">${student.exam_type || '—'}</span></div>` : `<div><span style="color:#64748b;">Level:</span> <span style="font-weight:500;">${student.edu_level || '—'}</span></div>`}
                                <div class="full-width" style="grid-column:1/-1;"><span style="color:#64748b;">Goal:</span> <span style="font-weight:500;">${student.goal || '—'}</span></div>
                                <div class="full-width" style="grid-column:1/-1;"><span style="color:#64748b;">Status:</span> <span style="font-weight:500; ${student.current_status === 'IN' ? 'color:#2d9b4e;' : 'color:#e63946;'}">${student.current_status || 'OUT'}</span></div>
                            </div>
                        </div>

                        ${parent ? `
                        <div class="glass-card" style="padding:18px 20px; border-radius:14px;">
                            <h4 style="font-size:14px; font-weight:600; color:#0f2b3d; margin:0 0 10px;">Parent/Guardian Information</h4>
                            <div class="profile-info-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; font-size:14px;">
                                <div><span style="color:#64748b;">Name:</span> <span style="font-weight:500;">${parent.full_name}</span></div>
                                <div><span style="color:#64748b;">Relationship:</span> <span style="font-weight:500;">${parent.relationship || '—'}</span></div>
                                <div><span style="color:#64748b;">Phone (Call):</span> <span style="font-weight:500;">${parent.phone_call || '—'}</span></div>
                                <div><span style="color:#64748b;">Phone (WhatsApp):</span> <span style="font-weight:500;">${parent.phone_whatsapp || '—'}</span></div>
                                <div><span style="color:#64748b;">Email:</span> <span style="font-weight:500;">${parent.email || '—'}</span></div>
                                <div><span style="color:#64748b;">Occupation:</span> <span style="font-weight:500;">${parent.occupation || '—'}</span></div>
                                <div class="full-width" style="grid-column:1/-1;"><span style="color:#64748b;">Address:</span> <span style="font-weight:500;">${parent.address || '—'}</span></div>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                </div>

                <!-- Attendance Section -->
                <div class="glass-card" style="padding:18px 20px; border-radius:14px; margin-top:24px;">
                    <h4 style="font-size:14px; font-weight:600; color:#0f2b3d; margin:0 0 10px;">Attendance Log</h4>
                    <div class="attendance-stats" style="display:flex; gap:20px; margin-bottom:12px; flex-wrap:wrap;">
                        <span style="font-size:13px;">✅ Present: <strong>${present}</strong></span>
                        <span style="font-size:13px;">🟡 Late: <strong>${late}</strong></span>
                        <span style="font-size:13px;">❌ Absent: <strong>${absent}</strong></span>
                        <span style="font-size:13px; color:#94a3b8;">Total: <strong>${attendance.length}</strong></span>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Sign In</th>
                                    <th>Status</th>
                                    <th>Sign Out</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${attendanceHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // =============================================
        // ✅ RENDER STAFF PROFILE - Responsive
        // =============================================
        function renderStaffProfile(data) {
            const container = document.getElementById('profileContent');
            const staff = data.staff;
            const attendance = data.attendance || [];

            document.getElementById('profileTitle').textContent = `👤 ${staff.full_name || staff.email}`;
            document.getElementById('profileSubtitle').textContent = `Staff Profile • ${staff.role || 'Staff'}`;

            const roleMap = {
                'admin': '👑 Admin',
                'secretary': '📋 Secretary',
                'teacher': '👨‍🏫 Teacher',
                'other': '👤 Other'
            };
            const roleClassMap = {
                'admin': 'role-badge-admin',
                'secretary': 'role-badge-secretary',
                'teacher': 'role-badge-teacher',
                'other': 'role-badge-other'
            };
            const roleLabel = roleMap[staff.role] || staff.role;
            const roleClass = roleClassMap[staff.role] || 'role-badge-other';

            let present = 0, absent = 0;
            attendance.forEach(a => {
                if (a.sign_in) present++;
                else absent++;
            });

            let attendanceHtml = '';
            if (attendance.length === 0) {
                attendanceHtml = `
                    <tr>
                        <td colspan="4" style="text-align:center; padding:20px; color:#94a3b8;">No attendance records found.</td>
                    </tr>
                `;
            } else {
                attendance.slice(0, 10).forEach(a => {
                    const statusClass = a.sign_in ? 'badge-present' : 'badge-absent';
                    const statusDot = a.sign_in ? 'present' : 'absent';
                    const statusColor = a.sign_in ? '#2d9b4e' : '#e63946';
                    const statusLabel = a.sign_in ? 'PRESENT' : 'ABSENT';
                    
                    attendanceHtml += `
                        <tr>
                            <td style="padding:8px 12px; color:#64748b; font-size:13px;">${a.log_date || a.date || '—'}</td>
                            <td style="padding:8px 12px; font-weight:500; font-size:13px;">${a.sign_in || '—'}</td>
                            <td style="padding:8px 12px;">
                                <span class="${statusClass}" style="padding:2px 10px; border-radius:20px; font-size:9px; font-weight:600; display:inline-flex; align-items:center; gap:4px;">
                                    <span class="status-dot ${statusDot}" style="width:5px; height:5px; border-radius:50%; display:inline-block; background:${statusColor};"></span>
                                    ${statusLabel}
                                </span>
                            </td>
                            <td style="padding:8px 12px; color:#94a3b8; font-size:13px;">${a.sign_out || '—'}</td>
                        </tr>
                    `;
                });
            }

            // ✅ STAFF PHOTO
            let photoHtml = '';
            if (staff.photo_url) {
                const photoSrc = staff.photo_url.startsWith('data:') || staff.photo_url.startsWith('http') 
                    ? staff.photo_url 
                    : `data:image/jpeg;base64,${staff.photo_url}`;
                photoHtml = `<img src="${photoSrc}" alt="${staff.full_name || staff.email}" class="profile-avatar-lg" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`;
            } else {
                photoHtml = `
                    <div style="width:150px; height:150px; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center; border:4px solid #0f2b3d;">
                        <span class="material-symbols-outlined" style="font-size:64px; color:#94a3b8;">person</span>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="profile-grid" style="display:grid; grid-template-columns:1fr 2fr; gap:24px;">
                    <!-- LEFT COLUMN - Profile Sidebar -->
                    <div class="profile-sidebar" style="display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px; background:rgba(255,255,255,0.5); border-radius:14px; border:1px solid rgba(15,43,61,0.04);">
                        <div class="avatar-container">
                            ${photoHtml}
                        </div>
                        <div class="info-container" style="text-align:center;">
                            <h3 style="font-size:20px; font-weight:700; color:#0f2b3d; margin:0;">${staff.full_name || staff.email}</h3>
                            <span class="${roleClass}" style="padding:4px 16px; border-radius:20px; font-size:11px; font-weight:700; display:inline-block; margin-top:4px;">${roleLabel}</span>
                            <p style="font-size:13px; color:#64748b; margin:6px 0 0;">${staff.email}</p>
                            <p style="font-size:13px; font-weight:500; ${staff.current_status === 'IN' ? 'color:#2d9b4e;' : 'color:#e63946;'}">${staff.current_status || 'OUT'}</p>
                        </div>
                    </div>

                    <!-- RIGHT COLUMN - Details -->
                    <div style="display:flex; flex-direction:column; gap:20px;">
                        <div class="glass-card" style="padding:18px 20px; border-radius:14px;">
                            <h4 style="font-size:14px; font-weight:600; color:#0f2b3d; margin:0 0 10px;">Staff Information</h4>
                            <div class="profile-info-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; font-size:14px;">
                                <div><span style="color:#64748b;">Name:</span> <span style="font-weight:500;">${staff.full_name || '—'}</span></div>
                                <div><span style="color:#64748b;">Email:</span> <span style="font-weight:500;">${staff.email}</span></div>
                                <div><span style="color:#64748b;">Role:</span> <span style="font-weight:500;">${roleLabel}</span></div>
                                <div><span style="color:#64748b;">Status:</span> <span style="font-weight:500; ${staff.current_status === 'IN' ? 'color:#2d9b4e;' : 'color:#e63946;'}">${staff.current_status || 'OUT'}</span></div>
                                <div class="full-width" style="grid-column:1/-1;"><span style="color:#64748b;">Added:</span> <span style="font-weight:500;">${staff.created_at ? new Date(staff.created_at).toLocaleDateString() : '—'}</span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Attendance Section -->
                <div class="glass-card" style="padding:18px 20px; border-radius:14px; margin-top:24px;">
                    <h4 style="font-size:14px; font-weight:600; color:#0f2b3d; margin:0 0 10px;">Attendance Log</h4>
                    <div class="attendance-stats" style="display:flex; gap:20px; margin-bottom:12px; flex-wrap:wrap;">
                        <span style="font-size:13px;">✅ Present: <strong>${present}</strong></span>
                        <span style="font-size:13px;">❌ Absent: <strong>${absent}</strong></span>
                        <span style="font-size:13px; color:#94a3b8;">Total: <strong>${attendance.length}</strong></span>

                    <div class="table-wrap">

                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // =============================================
        // ✅ EVENT LISTENERS (CSP COMPLIANT)
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            
            // --- Sidebar toggle ---
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', toggleSidebar);
            }

            // --- Logout ---
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', handleLogout);
            }

            // --- Register Student ---
            const registerBtn = document.getElementById('registerStudentBtn');
            if (registerBtn) {
                registerBtn.addEventListener('click', function() {
                    navigateTo('registration.html');
                });
            }

            // --- Navigation links ---
            const navLinks = {
                'navDashboard': '/admin_dashboard.html',
                'navStudents': '/admin_students.html',
                'navFinance': '/admin_finance.html',
                'navStaff': '/admin_staff.html',
                'navAttendance': '/admin_attendance.html',
                'navNotes': '/admin_notes.html',
                'navSettings': '/settings.html'
            };

            Object.keys(navLinks).forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('click', function(e) {
                        e.preventDefault();
                        navigateTo(navLinks[id]);
                    });
                }
            });

            // --- Print button ---
            const printBtn = document.getElementById('printBtn');
            if (printBtn) {
                printBtn.addEventListener('click', printPage);
            }

            // --- Back button ---
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.addEventListener('click', goBack);
            }

            // --- Notifications ---
            const notifBtn = document.getElementById('notificationsBtn');
            if (notifBtn) {
                notifBtn.addEventListener('click', function() {
                    navigateTo('notes.html');
                });
            }

            // --- Help ---
            const helpBtn = document.getElementById('helpBtn');
            if (helpBtn) {
                helpBtn.addEventListener('click', function() {
                    navigateTo('admin_dashboard.html');
                });
            }

            // --- Search input ---
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('keyup', function(e) {
                    const query = e.target.value.trim();
                    if (query.length > 2) {
                        navigateTo(`admin_students.html?search=${encodeURIComponent(query)}`);
                    }
                });
            }

            // --- Load profile ---
            loadProfile();
        });
    </script>
</body>
</html>
