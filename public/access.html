 
<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Geo Solution - Staff Portal Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            theme: {
                extend: {
                    colors: {
                        "primary": "#0f2b3d",
                        "primary-container": "#0f2b3d",
                        "secondary": "#1a5f7a",
                        "secondary-container": "#a3dfff",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#7993a8",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#21647f",
                        "on-background": "#1a1c1d",
                        "on-surface-variant": "#43474c",
                        "background": "#faf9fa",
                        "surface": "#faf9fa",
                        "surface-container": "#efedef",
                        "surface-container-low": "#f4f3f5",
                        "surface-container-high": "#e9e8e9",
                        "surface-container-highest": "#e3e2e4",
                        "outline": "#73777d",
                        "outline-variant": "#c3c7cc",
                        "error": "#e63946",
                        "success": "#2d9b4e",
                        "warning": "#f4a261",
                        "tertiary": "#211000",

                        "surface-bright": "#faf9fa",

                        "inverse-surface": "#2f3032",
                        "inverse-on-surface": "#f1f0f2",
                        "inverse-primary": "#afcae1",
                        "tertiary-container": "#3b2307",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#2c1600",
                        "on-tertiary-container": "#ad8864",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#92cfee",
                        "primary-fixed-dim": "#afcae1",
                        "on-primary-fixed": "#001e2f",
                        "on-primary-fixed-variant": "#30495d",
                        "on-secondary-fixed": "#001e2b",
                        "on-secondary-fixed-variant": "#004d66"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",

                        full: "9999px"

                    spacing: {

                        'headline-md': ['24px', { lineHeight: '32px', fontWeight: '600' }],
                        'headline-lg-mobile': ['24px', { lineHeight: '32px', fontWeight: '700' }],
                        'body-lg': ['18px', { lineHeight: '28px', fontWeight: '400' }],
                        'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }],
                        'body-sm': ['14px', { lineHeight: '20px', fontWeight: '400' }],
                        'label-md': ['14px', { lineHeight: '20px', letterSpacing: '0.05em', fontWeight: '600' }],
                        'label-sm': ['12px', { lineHeight: '16px', fontWeight: '500' }]

    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=1200');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 43, 61, 0.6);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .bg-image.fallback {
            background: linear-gradient(135deg, #0f2b3d 0%, #1a5f7a 100%);
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 48px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-morphism:hover {
            box-shadow: 0 12px 64px 0 rgba(0, 0, 0, 0.25);
        }

        .input-focus-effect {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .input-focus-effect:focus {
            border-bottom: 2px solid #00b4d8;
            background: rgba(255, 255, 255, 0.95);
            outline: none;
            box-shadow: 0 4px 16px rgba(0, 180, 216, 0.1);
        }

        .primary-btn-hover {
            transition: all 0.3s ease;
        }

        .primary-btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(15, 43, 61, 0.25);
        }

        .primary-btn-hover:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 14px 24px;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            animation: slideInRight 0.4s ease, fadeOut 0.4s ease 3s forwards;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            min-width: 280px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast-success { background: #2d9b4e; }
        .toast-error { background: #e63946; }
        .toast-warning { background: #f4a261; }
        .toast-info { background: #1a5f7a; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(50px); }
        }

        @media (max-width: 768px) {
            .glass-morphism {
                padding: 24px !important;
                margin: 16px;
            }
            
            .glass-morphism .brand-icon {
                width: 56px !important;
                height: 56px !important;
            }
            
            .glass-morphism .brand-icon .material-symbols-outlined {
                font-size: 28px !important;
            }
            
            .glass-morphism h1 {
                font-size: 22px !important;
            }
            
            .glass-morphism h2 {
                font-size: 20px !important;
            }
            
            .toast-container {
                right: 16px;
                left: 16px;
                bottom: 16px;
            }
            
            .toast {
                min-width: unset;
                width: 100%;
                font-size: 13px;
                padding: 12px 16px;
            }

            .bg-image {
                background-position: 60% center;
            }
        }

        @media (max-width: 480px) {
            .glass-morphism {
                padding: 20px !important;
                margin: 12px;
            }
            
            .glass-morphism .brand-icon {
                width: 48px !important;
                height: 48px !important;
            }
            
            .glass-morphism .brand-icon .material-symbols-outlined {
                font-size: 24px !important;
            }
            
            .glass-morphism h1 {
                font-size: 20px !important;
            }
            
            .glass-morphism h2 {
                font-size: 18px !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-image" id="bgImage"></div>

    <main class="relative z-10 flex min-h-screen items-center justify-center p-margin-mobile md:p-margin-desktop">
        <div class="glass-morphism w-full max-w-md rounded-2xl p-6 md:p-8 flex flex-col items-center">
            <div class="mb-6 text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary mb-3 shadow-lg brand-icon">
                    <span class="material-symbols-outlined text-[32px]">hub</span>
                </div>
                <h1 class="font-headline-md text-headline-md text-primary mt-2">Geo Solution</h1>
                <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mt-1">Precision Management</p>
            </div>

            <div class="w-full text-center mb-5">
                <h2 class="font-headline-lg text-headline-lg text-on-surface flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-primary-container">lock</span>
                    Staff Portal
                </h2>
                <p class="font-body-md text-body-md text-on-surface-variant mt-2 px-3">
                    Enter your registered email and PIN to access your dashboard
                </p>
            </div>

            <form class="w-full space-y-4" id="accessForm">
                <div class="flex flex-col gap-2">
                    <label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">
                        Work Email
                    </label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-secondary-fixed-dim transition-colors">
                            mail
                        </span>
                        <input class="w-full pl-[44px] pr-4 py-3 bg-white/50 border border-outline/10 rounded-lg font-body-md text-on-surface placeholder:text-on-surface-variant/50 input-focus-effect" 
                               id="email" 
                               placeholder="Enter your email address" 
                               required 
                               type="email"
                               autofocus/>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-label-md text-label-md text-on-surface-variant ml-1" for="pin">
                        Security PIN (6 digits)
                    </label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-secondary-fixed-dim transition-colors">
                            pin
                        </span>
                        <input class="w-full pl-[44px] pr-4 py-3 bg-white/50 border border-outline/10 rounded-lg font-body-md text-on-surface placeholder:text-on-surface-variant/50 input-focus-effect" 
                               id="pin" 
                               placeholder="Enter 6-digit PIN" 
                               required 
                               type="password"
                               maxlength="6"
                               pattern="[0-9]{6}"/>
                    </div>
                </div>

                <div id="errorMsg" class="hidden text-error text-sm font-medium flex items-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">error</span>
                    <span id="errorText">Invalid credentials. Please try again.</span>
                </div>

                <div id="roleDisplay" class="hidden p-3 rounded-lg text-center font-semibold text-sm">
                    <span id="roleText"></span>
                </div>

                <div class="pt-2">
                    <button class="w-full bg-primary-container text-white py-3 px-4 rounded-lg font-label-md text-label-md flex items-center justify-center gap-2 primary-btn-hover active:scale-[0.98] cursor-pointer" 
                            type="submit" 
                            id="accessBtn">
                        <span class="material-symbols-outlined">lock_open</span>
                        <span id="btnText">Access Dashboard</span>
                        <span class="spinner hidden animate-spin material-symbols-outlined">sync</span>
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-5 border-t border-outline/5 w-full flex flex-col items-center gap-3">
                <a class="group flex items-center gap-1 font-label-md text-label-md text-secondary hover:text-primary transition-colors cursor-pointer" 
                   href="/registration.html">
                    <span class="material-symbols-outlined text-body-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    Back to Home
                </a>
                <div class="flex flex-wrap justify-center gap-3 font-label-sm text-label-sm text-on-surface-variant/60">
                    <a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
                    <span class="opacity-30">•</span>
                    <a class="hover:text-primary transition-colors" href="#">IT Support</a>
                </div>
            </div>
        </div>
    </main>

    <div class="fixed top-6 right-6 z-20 hidden md:block">
        <div class="flex items-center gap-2 px-4 py-2 glass-morphism rounded-full border border-white/40">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            <span class="font-label-sm text-label-sm text-on-surface tracking-tight">System Operational</span>
        </div>
    </div>

    <div class="fixed bottom-4 left-0 w-full md:hidden flex justify-center px-4 z-20">
        <div class="glass-morphism px-4 py-2 rounded-full text-center">
            <span class="font-label-sm text-label-sm text-on-surface-variant">Geo Solution Secure Entry v2.4</span>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/config.js"></script>
<script>
        const BASE_API = window.BASE_API || 'https://your-backend-url.com/api';
        
        const bgImage = document.getElementById('bgImage');
        
        bgImage.addEventListener('error', function() {
            this.classList.add('fallback');
        });

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            const icons = {
                success: 'check_circle',
                error: 'error',
                warning: 'warning',
                info: 'info'
            };
            
            toast.innerHTML = `
                <span class="material-symbols-outlined" style="font-size:22px;">${icons[type] || 'info'}</span>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.remove();
                }
            }, 3000);
        }

        const form = document.getElementById('accessForm');
        const emailInput = document.getElementById('email');
        const pinInput = document.getElementById('pin');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const roleDisplay = document.getElementById('roleDisplay');
        const roleText = document.getElementById('roleText');
        const btn = document.getElementById('accessBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.querySelector('.spinner');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim().toLowerCase();
            const pin = pinInput.value.trim();
            
            if (pin.length !== 6 || !/^\d{6}$/.test(pin)) {
                errorMsg.classList.remove('hidden');
                errorText.textContent = '❌ PIN must be exactly 6 digits.';
                showToast('❌ PIN must be exactly 6 digits.', 'error');
                return;
            }
            
            btn.disabled = true;
            btnText.textContent = 'Verifying...';
            spinner.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            roleDisplay.classList.add('hidden');
            roleDisplay.className = 'hidden p-3 rounded-lg text-center font-semibold text-sm';

            try {
                const response = await fetch(`${BASE_API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pin })
                });
                
                const data = await response.json();

                if (!response.ok) {
                    errorMsg.classList.remove('hidden');
                    errorText.textContent = data.error || '❌ Invalid credentials. Please try again.';
                    btn.disabled = false;
                    btnText.textContent = 'Access Dashboard';
                    spinner.classList.add('hidden');
                    showToast('❌ Login failed', 'error');
                    return;
                }

                const { role } = data;
                
                const displayName = role === 'admin' ? 'Admin' : 'Secretary';
                const emoji = role === 'admin' ? '👑' : '📋';
                
                roleDisplay.className = `p-3 rounded-lg text-center font-semibold text-sm ${role === 'admin' ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'}`;
                roleDisplay.classList.remove('hidden');
                roleText.textContent = `${emoji} Welcome ${displayName}! Redirecting...`;
                
                showToast(`✅ Welcome ${displayName}!`, 'success');
                
                await new Promise(r => setTimeout(r, 1200));
                const dashboard = role === 'admin' ? '/admin_dashboard.html' : '/secretary_dashboard.html';
                window.location.href = dashboard;
                
            } catch (err) {
                console.error('Login error:', err);
                errorMsg.classList.remove('hidden');
                errorText.textContent = '❌ Connection error. Please try again later.';
                btn.disabled = false;
                btnText.textContent = 'Access Dashboard';
                spinner.classList.add('hidden');
                showToast('❌ Connection error', 'error');
            }
        });

        emailInput.addEventListener('focus', () => {
            document.querySelector('.glass-morphism').style.transform = 'scale(1.01)';
        });

        emailInput.addEventListener('blur', () => {
            document.querySelector('.glass-morphism').style.transform = 'scale(1)';
        });

        pinInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });
    </script>
</body>
</html>
